name: RunNightlyTests
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      host:
        type: string
        description: DUT host name(s) — comma-separated for multiple DUTs (inventory IP resolution, factory reset, RPC on each). Snappi uses workflow run-snappi-nightly-tests.yml instead.
        required: true
      testbed:
        type: string
        description: Testbed name to run test on
        required: true
      ansible_inventory:
        type: string
        description: Inventory file to use for ansible commands
        required: true
      fanoutip:
        type: string
        description: Fanout management IP (optional). Omitted or empty skips fanout factory reset/reload.
        required: false
      switch_user:
        type: string
        description: User name to login to switch
        required: true
      test_files:
        type: string
        description: Comma separated test files to run
        required: true
      runner_label:
        type: string
        description: Runner label to use for jobs
        required: true
      ALLURE_JOB_RUN_ID:
        type: string
        description: "ALLURE_JOB_RUN_ID service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        type: string
        description: "ALLURE_USERNAME service parameter. Leave blank"
        required: false
      ALLURE_ENV:
        type: string
        description: "Base64-encoded Allure environment variables from shared job run. Leave blank if not using shared job run."
        required: false
      sonic_version:
        type: string
        description: "Image tag to use for sonic-mgmt and syncd-rpc containers (e.g. 202505)"
        required: true
      port_count:
        type: string
        description: "Port count descriptor for Allure launch title (e.g. 32-Port, 64-Port)"
        required: false
      skip_topo:
        type: boolean
        description: "Skip remove-topo and add-topo steps (topology assumed already deployed)"
        required: false
        default: false
      ALLURE_LAUNCH_TAG:
        type: string
        description: "Override ALLURE_LAUNCH_TAGS (if set, used verbatim instead of computed tags)"
        required: false
      ALLURE_LAUNCH_NAME:
        type: string
        description: "Override ALLURE_LAUNCH_NAME (if set, used verbatim instead of computed name)"
        required: false
    secrets:
      ALLURE_TOKEN:
        required: true
      GH_PAT:
        required: true
      TESTSERVER_PWD:
        required: true
      SWITCH_PASSWORD:
        required: true
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

  workflow_dispatch:
    inputs:
      host:
        type: choice
        description: DUT Host name in testbed file
        options:
          - upscalelab2-spine6
          - upscalelab2-spine7
          - upscalelab2-spine8
          - upscalelab2-spine9
          - upscalelab2-spine6-800
          - upscalelab2-spine7-800
          - upscalelab2-spine8-800
          - upscalelab2-spine9-800
        default: upscalelab2-spine7
        required: true
      testbed:
        type: choice
        description: Testbed name to run test on
        options:
          - caspian_testbed_t0_spine6
          - caspian_testbed_t0_spine7
          - caspian_testbed_t0_spine8
          - caspian_testbed_t0_spine9
          - caspian_testbed_t0_spine6-800
          - caspian_testbed_t0_spine7-800
          - caspian_testbed_t0_spine8-800
          - caspian_testbed_t0_spine9-800
        default: caspian_testbed_t0_spine7
        required: true
      ansible_inventory:
        type: choice
        description: Inventory file to use for ansible commands
        options:
          - veos
          - inventory
        default: veos
        required: true
      fanoutip:
        type: string
        description: Fanout IP (optional). Leave empty to skip fanout steps.
        required: false
        default: ""
      switch_user:
        type: string
        description: User name to login to switch
        default: admin
        required: true
      test_files:
        type: string
        description: Comma separated test files to run
        default: "base_suite_tests.txt,mgmt_suite_tests.txt,l2_suite_tests.txt,l3_suite_tests.txt"
      runner_label:
        type: string
        required: true
      ALLURE_JOB_RUN_ID:
        description: "ALLURE_JOB_RUN_ID service parameter. Leave blank."
        required: false
      ALLURE_USERNAME:
        description: "ALLURE_USERNAME service parameter. Leave blank"
        required: false
      ALLURE_ENV:
        description: "Base64-encoded Allure environment variables from shared job run. Leave blank if not using shared job run."
        required: false
      sonic_version:
        description: "Image tag to use for sonic-mgmt and syncd-rpc containers (e.g. 202505)"
        required: true
      port_count:
        description: "Port count descriptor for Allure launch title (e.g. 32-Port, 64-Port)"
        default: "32-Port"
        required: false
      skip_topo:
        type: boolean
        description: "Skip remove-topo and add-topo steps (topology assumed already deployed)"
        default: false
        required: false
      ALLURE_LAUNCH_TAG:
        description: "Override ALLURE_LAUNCH_TAGS (if set, used verbatim instead of computed tags)"
        required: false
      ALLURE_LAUNCH_NAME:
        description: "Override ALLURE_LAUNCH_NAME (if set, used verbatim instead of computed name)"
        required: false
env:
  SSH_OPTS: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  ALLURE_PROJECT_ID: 78
  ALLURE_ENDPOINT: https://upscaleai.testops.cloud
  ALLURE_RESULTS: tests/allure-results

jobs:
  normalize-inputs:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ inputs.host || github.event.inputs.host || 'undefined' }}
      testbed: ${{ inputs.testbed || github.event.inputs.testbed || github.event.client_payload.testbed || 'caspian_testbed_t0_spine7' }}
      fanout_ip: ${{ inputs.fanoutip || github.event.inputs.fanoutip || github.event.client_payload.fanout_ip || '' }}
      switch_user: ${{ inputs.switch_user || github.event.inputs.switch_user || github.event.client_payload.switch_user || 'admin' }}
      ansible_inventory: ${{ inputs.ansible_inventory || github.event.inputs.ansible_inventory || github.event.client_payload.ansible_inv || 'veos' }}
      test_files: ${{ inputs.test_files || github.event.inputs.test_files || github.event.client_payload.test_files || 'base_suite_tests.txt,mgmt_suite_tests.txt,l2_suite_tests.txt,l3_suite_tests.txt' }}
      runner_label: ${{ inputs.runner_label || github.event.inputs.runner_label }}
      port_count: ${{ inputs.port_count || github.event.inputs.port_count || '32-Port' }}
      skip_topo: ${{ inputs.skip_topo == true || github.event.inputs.skip_topo == 'true' }}
    steps:
      - name: Set outputs
        run: echo "Normalizing inputs"

  setup-allure:
    needs: normalize-inputs
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    outputs:
      allure-env: ${{ steps.allure-context.outputs.allure-env }}
      launch-date: ${{ steps.allure-context.outputs.launch-date }}
    steps:
      - name: install and configure allurectl
        uses: allure-framework/setup-allurectl@v1.0.0
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}
          github-token: ${{ secrets.GH_PAT }}

      - name: get context for allurectl
        id: allure-context
        run: |
          # Check if ALLURE_ENV is provided (shared job run from parent workflow)
          if [ -n "${{ inputs.ALLURE_ENV }}" ]; then
            echo "Using shared Allure job run from parent workflow"
            # Use the provided base64-encoded environment variables directly
            echo "allure-env=${{ inputs.ALLURE_ENV }}" >> $GITHUB_OUTPUT
            # Same LAUNCH_DATE (MM/DD/YY, America/Los_Angeles) as used for Allure when creating a new job run
            LAUNCH_DATE=$(TZ=America/Los_Angeles date '+%m/%d/%y')
            echo "launch-date=${LAUNCH_DATE}" >> $GITHUB_OUTPUT
            # Decode to show what we're using
            echo "${{ inputs.ALLURE_ENV }}" | base64 -d > /tmp/allure-env-decoded
            echo "Environment variables from shared job run:"
            cat /tmp/allure-env-decoded
          else
            echo "Creating new Allure job run for this workflow execution"

            # --- Launch title: "Nightly : T0/T1 : Suites : MM/DD/YY" ---

            # Date (MM/DD/YY) in Pacific time (PST/PDT) — single source for launch title, S3 paths, and downstream timestamps
            LAUNCH_DATE=$(TZ=America/Los_Angeles date '+%m/%d/%y')
            echo "launch-date=${LAUNCH_DATE}" >> $GITHUB_OUTPUT

            # Topology label (e.g. t0 -> T0, t1-lag -> T1-lag)
            TOPO=$(cut -d "_" -f 3 <<< "${{ needs.normalize-inputs.outputs.testbed }}")
            TOPO_LABEL=$(echo "$TOPO" | sed 's/^t/T/')

            # Suite labels: derived dynamically from test_files input order
            # Strips "_suite_tests*" suffix, deduplicates, then title-cases each prefix.
            # Special cases: l2->L2, l3->L3, qos->QoS; everything else gets first-letter cap.
            IFS=',' read -ra TEST_FILE_ARRAY <<< "${{ needs.normalize-inputs.outputs.test_files }}"
            declare -A suite_seen
            suite_order=()
            for f in "${TEST_FILE_ARRAY[@]}"; do
              f=$(echo "$f" | xargs)
              [[ -z "$f" ]] && continue
              prefix=$(echo "$f" | sed 's/_suite_tests.*//')
              [[ -z "$prefix" ]] && continue
              if [[ -z "${suite_seen[$prefix]+x}" ]]; then
                suite_seen[$prefix]=1
                suite_order+=("$prefix")
              fi
            done
            suite_labels=()
            for suite in "${suite_order[@]}"; do
              case $suite in
                l2)  suite_labels+=("L2") ;;
                l3)  suite_labels+=("L3") ;;
                qos) suite_labels+=("QoS") ;;
                *)   suite_labels+=("$(echo "${suite:0:1}" | tr '[:lower:]' '[:upper:]')${suite:1}") ;;
              esac
            done
            suites_label=$(IFS=', '; echo "${suite_labels[*]}")
            [ -z "$suites_label" ] && suites_label="Tests"

            # Allure launch tags (applied when the launch/job-run is created)
            if [ -n "${{ inputs.ALLURE_LAUNCH_TAG }}" ]; then
              export ALLURE_LAUNCH_TAGS="${{ inputs.ALLURE_LAUNCH_TAG }}"
            else
              export ALLURE_LAUNCH_TAGS="topo:${TOPO_LABEL},sonic_version:${{ inputs.sonic_version }},port_count:${{ needs.normalize-inputs.outputs.port_count }}"
            fi

            if [ -n "${{ inputs.ALLURE_LAUNCH_NAME }}" ]; then
              export ALLURE_LAUNCH_NAME="${{ inputs.ALLURE_LAUNCH_NAME }}"
            else
              export ALLURE_LAUNCH_NAME="Nightly : ${TOPO_LABEL} : ${suites_label} : ${LAUNCH_DATE}"
            fi
            echo "Allure launch name: $ALLURE_LAUNCH_NAME"
            allurectl job-run start
            export $(allurectl job-run env)
            printenv | grep ALLURE_
            echo "allure-env=$(allurectl job-run env | base64 -w 0)" >> $GITHUB_OUTPUT
            echo "allurectl job-run env"
            echo "$(allurectl job-run env)"
          fi

  setup:
    needs: [normalize-inputs, setup-allure]
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    outputs:
      rpc_pull_success: ${{ steps.rpc-pull-status.outputs.rpc_pull_success }}
    timeout-minutes: 180
    env:
      HOST: ${{ needs.normalize-inputs.outputs.host }}
      TESTBED: ${{ needs.normalize-inputs.outputs.testbed }}
      FANOUT_IP: ${{ needs.normalize-inputs.outputs.fanout_ip }}
      SWITCH_USER: ${{ needs.normalize-inputs.outputs.switch_user }}
      ANSIBLE_INVENTORY: ${{ needs.normalize-inputs.outputs.ansible_inventory }}
      TEST_FILES: ${{ needs.normalize-inputs.outputs.test_files }}
      SKIP_TOPO: ${{ needs.normalize-inputs.outputs.skip_topo }}
    steps:
      # Re-reserve the testbed at the start of setup. The standalone reserve-testbed
      # job in the parent workflow can race with a prior workflow's release-testbed
      # (because both queue for the same self-hosted runner). Reserving here, in the
      # same job that performs setup, guarantees the reservation is held while we
      # actually use the testbed.
      - name: Reserve testbed (pre-setup)
        run: |
          TESTBED_ID=$(echo "${{ env.HOST }}" | sed -E 's/.*spine([0-9]+).*/\1/')
          if ! [[ "$TESTBED_ID" =~ ^[0-9]+$ ]]; then
            echo "WARNING: Could not derive numeric testbed id from host '${{ env.HOST }}'; skipping reserve"
            exit 0
          fi
          echo "Reserving testbed ${TESTBED_ID} (host=${{ env.HOST }}) on testbed reservation system"
          curl -sS --fail --connect-timeout 5 --max-time 30 -X POST "http://192.168.218.28:8001/api/reserve/testbed/${TESTBED_ID}/force" \
            -H "Content-Type: application/json" \
            -d '{"user":"sonic-mgmt","duration_hours":35,"scope":"all","reason":"sonic-mgmt nightly testing"}' \
            || { echo "ERROR: reserve API call failed for testbed ${TESTBED_ID}"; exit 1; }

      - name: Fix permissions before checkout
        run: |
          sudo chown -R $USER:$USER ansible tests allure-history allure-report tests/allure-results sanity/__pycache__ .pytest_cache || true
          echo "TESTBEDFILE=testbed.yaml" >> $GITHUB_ENV
          TOPO=$(cut -d "_" -f 3 <<< "${{ env.TESTBED }}")
          echo "TOPO=$TOPO" >> $GITHUB_ENV
          # Map topology variants to base topology for run_tests.sh command, but keep original TOPO for container naming
          if [[ "$TOPO" == t1-* ]]; then
            TOPO_FOR_TESTS="t1"
          elif [[ "$TOPO" == t0-* ]]; then
            TOPO_FOR_TESTS="t0"
          else
            TOPO_FOR_TESTS="$TOPO"
          fi
          echo "TOPO_FOR_TESTS=$TOPO_FOR_TESTS" >> $GITHUB_ENV
          echo "SONIC_MGMT_CONTAINER=sonic-mgmt-ngty-${TOPO}" >> $GITHUB_ENV

      - name: Stop ${{ env.SONIC_MGMT_CONTAINER }} docker container
        if: ${{ env.SKIP_TOPO != 'true' }}
        run: docker stop ${{ env.SONIC_MGMT_CONTAINER }} && docker rm ${{ env.SONIC_MGMT_CONTAINER }} || true

      - name: Checkout sonic-mgmt repo
        uses: actions/checkout@v4

      - name: Get the IP address(es) from ansible inventory file
        run: |
          set -e
          # Works for YAML (e.g. veos) and INI inventories: ansible-inventory --host merges host vars.
          lookup_mgmt_ip() {
            local inv_name="$1" host="$2"
            local inv_path="ansible/${inv_name}" json ip=""
            json=$(ANSIBLE_NOCOLOR=1 ansible-inventory -i "$inv_path" --host "$host" 2>/dev/null) || true
            if [ -n "$json" ] && [ "$json" != "{}" ]; then
              ip=$(printf '%s' "$json" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('ansible_host') or d.get('ansible_ssh_host') or '',end='')" 2>/dev/null || true)
            fi
            if [ -z "$ip" ]; then
              ip=$(ANSIBLE_NOCOLOR=1 ansible -i "$inv_path" -m debug -a 'var=ansible_host' "$host" 2>/dev/null | sed -n 's/.*"ansible_host": "\([^"]*\)".*/\1/p' | head -1)
            fi
            printf '%s' "$ip"
          }
          INV="${{ env.ANSIBLE_INVENTORY }}"
          HOST_STR="${{ env.HOST }}"
          IPS_CSV=""
          while IFS= read -r h; do
            h=$(echo "$h" | xargs)
            [ -z "$h" ] && continue
            ip=$(lookup_mgmt_ip "$INV" "$h")
            if [ -z "$ip" ]; then
              echo "Error: could not resolve ansible_host for '$h' in inventory ansible/${INV} (try: ansible-inventory -i ansible/${INV} --host '$h')" >&2
              exit 1
            fi
            if [ -z "$IPS_CSV" ]; then IPS_CSV="$ip"; else IPS_CSV="$IPS_CSV,$ip"; fi
          done <<< "$(echo "$HOST_STR" | tr ',' '\n')"
          echo "SWITCH_IPS=$IPS_CSV" >> "$GITHUB_ENV"
          echo "SWITCH_IP=$(echo "$IPS_CSV" | cut -d',' -f1)" >> "$GITHUB_ENV"
          echo "Resolved DUT ansible_host(s): $IPS_CSV"

      - name: Setup test environment
        if: ${{ env.SKIP_TOPO != 'true' }}
        run: |
          echo "HOST=${HOST}"
          echo "SWITCH_IPS=${SWITCH_IPS:-<unset>}"
          echo "Reset factory settings on all DUT switch(es)"
          # Use shell $SWITCH_IPS (from GITHUB_ENV), not ${{ env.SWITCH_IPS }} — the latter can be empty/stale for comma-separated values in some runners.
          SIP_ARR=()
          while IFS= read -r _sip || [ -n "${_sip}" ]; do
            _sip=$(echo "$_sip" | xargs)
            [ -z "$_sip" ] && continue
            SIP_ARR+=("$_sip")
          done < <(echo "${SWITCH_IPS}" | tr ',' '\n')
          echo "Parsed ${#SIP_ARR[@]} DUT IP(s) for factory reset / reload: ${SIP_ARR[*]}"
          if [ "${#SIP_ARR[@]}" -eq 0 ]; then
            echo "Error: SWITCH_IPS is empty — cannot reset DUT(s). Check HOST and inventory resolution." >&2
            exit 1
          fi
          # Preserve for RPC block later: `export $(cat /tmp/allure-env)` can overwrite env vars if names collide.
          _DUT_IPS_CSV="${SWITCH_IPS}"
          for sip in "${SIP_ARR[@]}"; do
            sip=$(echo "$sip" | xargs)
            echo "config-setup factory keep-basic on DUT $sip"
            /usr/bin/sshpass -p "${{ secrets.SWITCH_PASSWORD }}" ssh -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "sudo config-setup factory keep-basic"
          done
          if [ -n "$FANOUT_IP" ]; then
            echo "config-setup factory keep-basic on fanout $FANOUT_IP"
            /usr/bin/sshpass -p "${{ secrets.SWITCH_PASSWORD }}" ssh -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$FANOUT_IP" "sudo config-setup factory keep-basic"
          else
            echo "No fanout IP — skipping fanout factory reset"
          fi

          echo "Reload config on all DUT(s)"
          for sip in "${SIP_ARR[@]}"; do
            sip=$(echo "$sip" | xargs)
            /usr/bin/sshpass -p "${{ secrets.SWITCH_PASSWORD }}" ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "sudo config reload -y -f"
          done
          if [ -n "$FANOUT_IP" ]; then
            /usr/bin/sshpass -p "${{ secrets.SWITCH_PASSWORD }}" ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$FANOUT_IP" "sudo config reload -y -f"
          else
            echo "No fanout IP — skipping fanout config reload"
          fi

          echo "Waiting 60 seconds for config reload to complete"
          sleep 60

          echo "SONIC_ROOT=$(pwd)" >> $GITHUB_ENV
          echo "Get management IP address of server"
          DEFAULT_INTERFACE=$(ip route | awk '/default/ { print $5 }')
          DEFAULT_IP=$(ip -4 addr show "$DEFAULT_INTERFACE" | awk '/inet/ {print $2}' | cut -d'/' -f1)

          # Decode and export allure environment variables
          echo "${{ needs.setup-allure.outputs.allure-env }}" | base64 -d > /tmp/allure-env
          echo "Echoing /tmp/allure-env"
          cat /tmp/allure-env
          export $(cat /tmp/allure-env)

          # Bring up docker-sonic-mgmt container
          echo "Bring up docker-sonic-mgmt container"
          # Pass all Allure environment variables to the container via --env-file
          # Also explicitly set key variables to ensure they're available
          docker run -it -d --name ${{ env.SONIC_MGMT_CONTAINER }} \
            --network host \
            --cap-add=NET_ADMIN \
            --privileged \
            -e ALLURE_ENDPOINT=${{ env.ALLURE_ENDPOINT }} \
            -e ALLURE_PROJECT_ID=${{ env.ALLURE_PROJECT_ID }} \
            -e ALLURE_TOKEN=${{ secrets.ALLURE_TOKEN }} \
            --env-file /tmp/allure-env \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/var/AzDevOps \
            docker-sonic-mgmt-allure:${{ inputs.sonic_version }} bash

          echo "Delete previously added ssh keys from nightly workflow"
          cp ~/.ssh/authorized_keys ~/.ssh/authorized_keys_copy
          sed -i '/Nightly_github_workflow/d' ~/.ssh/authorized_keys

          echo "Generate SSH keypair inside container"
          docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "rm -f /root/.ssh/id_rsa /root/.ssh/id_rsa.pub && ssh-keygen -t rsa -b 4096 -C 'Nightly_github_workflow' -f /root/.ssh/id_rsa -N '' -q"

          echo "Copy public key from container to host"
          docker cp ${{ env.SONIC_MGMT_CONTAINER }}:/root/.ssh/id_rsa.pub ./id_rsa.pub

          echo "Install public key on remote server"
          cat ./id_rsa.pub | /usr/bin/sshpass -p ${{ secrets.TESTSERVER_PWD }} ssh ${{ env.SSH_OPTS }} ${USER}@${DEFAULT_IP} "mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys"

          if [ "${SKIP_TOPO}" != "true" ]; then
            echo "Remove T0, T1, and T1-lag topo"
            testbed=${{ env.TESTBED }}
            if [ "${TOPO}" == "t1" ]; then
                testbed="${testbed},${testbed/t1/t0},${testbed/t1/t1-lag}"
            elif [ "${TOPO}" == "t0" ]; then
                testbed="${testbed},${testbed/t0/t1},${testbed/t0/t1-lag}"
            elif [ "${TOPO}" == "t1-lag" ]; then
                testbed="${testbed},${testbed/t1-lag/t0},${testbed/t1-lag/t1}"
            elif [ "${TOPO}" == "t1-64" ]; then
                testbed="${testbed},${testbed/t1-64/t0},${testbed/t1-64/t1},${testbed/t1-64/t0-64},${testbed/t1-64/t1-64-lag}"
            elif [ "${TOPO}" == "t0-64" ]; then
                testbed="${testbed},${testbed/t0-64/t0},${testbed/t0-64/t1},${testbed/t0-64/t1-64},${testbed/t0-64/t1-64-lag}"
            elif [ "${TOPO}" == "t1-64-lag" ]; then
                testbed="${testbed},${testbed/t1-64-lag/t0},${testbed/t1-64-lag/t1},${testbed/t1-64-lag/t0-64},${testbed/t1-64-lag/t1-64}"
            fi
            remove_topo_filelist=($(echo "${testbed}" | tr "," "\n"))
            for tb_name in ${remove_topo_filelist[@]}; do
              echo "Running remove-topo for ${tb_name}"
              docker exec -u ${USER} ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{ env.TESTBEDFILE }} -m ${{ env.ANSIBLE_INVENTORY }} -k ceos remove-topo ${tb_name} ./password.txt -vvvv"
            done

            echo "Add topo"
            docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{ env.TESTBEDFILE }} -m ${{ env.ANSIBLE_INVENTORY }} -k ceos add-topo ${{ env.TESTBED }} ./password.txt -vvvv -e ptf_imagetag=${{ inputs.sonic_version }}"
          else
            echo "Skipping remove-topo and add-topo (skip_topo=true)"
          fi
          echo "Deploy minigraph"
          docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{env.TESTBEDFILE}} deploy-mg ${{ env.TESTBED }} ${{ env.ANSIBLE_INVENTORY }} ./password.txt -e use_ptf_tacacs_server=false -vvv"

          echo "Run pretest"
          # removing --skip_sanity and adding --allow_recover to prevent incomplete metadata generation
          TOPOLOGY_FILTER="${TOPO_FOR_TESTS},any"
          echo "Pretest topology filter: TOPO=${TOPO} TOPO_FOR_TESTS=${TOPO_FOR_TESTS} -> -t ${TOPOLOGY_FILTER}"
          PRET_INNER="cd /var/AzDevOps/tests && sudo ./run_tests.sh -d ${HOST} -n ${TESTBED} -f ../ansible/${TESTBEDFILE} -i ../ansible/${ANSIBLE_INVENTORY} -k debug -l debug -p test_logs/logs-pretest -c 'test_pretest.py' -e '--allow_recover --continue-on-collection-errors' -t ${TOPOLOGY_FILTER}"
          echo "Pretest command (inside container): ${PRET_INNER}"
          docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "${PRET_INNER}"

          rpc_pull_success=false
          echo "RPC: route, docker registry, reboot — on each DUT"
          RPC_SIP_ARR=()
          while IFS= read -r _sip || [ -n "${_sip}" ]; do
            _sip=$(echo "$_sip" | xargs)
            [ -z "$_sip" ] && continue
            RPC_SIP_ARR+=("$_sip")
          done < <(echo "${_DUT_IPS_CSV}" | tr ',' '\n')
          echo "RPC round: ${#RPC_SIP_ARR[@]} DUT(s): ${RPC_SIP_ARR[*]}"
          for sip in "${RPC_SIP_ARR[@]}"; do
            sip=$(echo "$sip" | xargs)
            NEXTHOP=$(echo "$sip" | cut -d'.' -f1-3).1
            echo "DUT $sip: nexthop ${NEXTHOP} for route to registry subnet"
            /usr/bin/sshpass -p ${{ secrets.SWITCH_PASSWORD }} ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "sudo config route add prefix 192.168.218.0/24 nexthop ${NEXTHOP}"
            /usr/bin/sshpass -p ${{ secrets.SWITCH_PASSWORD }} ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "echo '{\"insecure-registries\": [\"192.168.218.28:5000\"] }' | sudo tee /etc/docker/daemon.json"
            /usr/bin/sshpass -p ${{ secrets.SWITCH_PASSWORD }} ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "sudo reboot"
          done
          sleep 60
          for sip in "${RPC_SIP_ARR[@]}"; do
            sip=$(echo "$sip" | xargs)
            echo "Waiting for DUT $sip to come back online..."
            until /usr/bin/sshpass -p ${{ secrets.SWITCH_PASSWORD }} ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.SWITCH_USER }}@"$sip" 'echo "Switch is back online"'; do
              echo "Switch $sip not yet available, retrying in 30 seconds..."
              sleep 30
            done
          done

          max_attempts=10
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            pull_round_ok=true
            for sip in "${RPC_SIP_ARR[@]}"; do
              sip=$(echo "$sip" | xargs)
              if ! /usr/bin/sshpass -p ${{ secrets.SWITCH_PASSWORD }} ssh ${{ env.SSH_OPTS }} ${{ env.SWITCH_USER }}@"$sip" "docker pull 192.168.218.28:5000/docker-syncd-mlnx-rpc:${{ inputs.sonic_version }} && docker tag 192.168.218.28:5000/docker-syncd-mlnx-rpc:${{ inputs.sonic_version }} docker-syncd-mlnx-rpc:${{ inputs.sonic_version }} && docker tag 192.168.218.28:5000/docker-syncd-mlnx-rpc:${{ inputs.sonic_version }} docker-syncd-mlnx-rpc:latest"; then
                echo "RPC docker pull failed on $sip (attempt $((attempt + 1)))"
                pull_round_ok=false
              fi
            done
            if [ "$pull_round_ok" = true ]; then
              echo "RPC image pulled on all DUT(s) on attempt $((attempt + 1))"
              rpc_pull_success=true
              break
            fi
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "Retrying RPC pull in 30 seconds..."
              sleep 30
            fi
          done
          # Save RPC pull status to file for use in output step
          echo "$rpc_pull_success" > /tmp/rpc_pull_status.txt

      - name: Set RPC pull status output
        id: rpc-pull-status
        if: ${{ env.SKIP_TOPO != 'true' }}
        run: |
          RPC_STATUS=$(cat /tmp/rpc_pull_status.txt)
          echo "rpc_pull_success=$RPC_STATUS" >> $GITHUB_OUTPUT
          echo "RPC pull status: $RPC_STATUS"

      - name: Send error message to slack channel if setup fails
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"Nightly Test Aborted as setup failed\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

  run-test-and-generate-report:
    needs: [normalize-inputs, setup-allure, setup]
    timeout-minutes: 7200
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    env:
      HOST: ${{ needs.normalize-inputs.outputs.host }}
      TESTBED: ${{ needs.normalize-inputs.outputs.testbed }}
      FANOUT_IP: ${{ needs.normalize-inputs.outputs.fanout_ip }}
      SWITCH_USER: ${{ needs.normalize-inputs.outputs.switch_user }}
      ANSIBLE_INVENTORY: ${{ needs.normalize-inputs.outputs.ansible_inventory }}
      TEST_FILES: ${{ needs.normalize-inputs.outputs.test_files }}
      SKIP_TOPO: ${{ needs.normalize-inputs.outputs.skip_topo }}
    steps:
      - name: Export env vars
        run: |
          TOPO=$(cut -d "_" -f 3 <<< "${{ env.TESTBED }}")
          echo "TOPO=$TOPO" >> $GITHUB_ENV
          # Map topology variants to base topology for run_tests.sh command, but keep original TOPO for container naming
          if [[ "$TOPO" == t1-* ]]; then
            TOPO_FOR_TESTS="t1"
          elif [[ "$TOPO" == t0-* ]]; then
            TOPO_FOR_TESTS="t0"
          else
            TOPO_FOR_TESTS="$TOPO"
          fi
          echo "TOPO_FOR_TESTS=$TOPO_FOR_TESTS" >> $GITHUB_ENV
          echo "SONIC_MGMT_CONTAINER=sonic-mgmt-ngty-${TOPO}" >> $GITHUB_ENV
          echo "TESTBEDFILE=testbed.yaml" >> $GITHUB_ENV
          lookup_mgmt_ip() {
            local inv_name="$1" host="$2"
            local inv_path="ansible/${inv_name}" json ip=""
            json=$(ANSIBLE_NOCOLOR=1 ansible-inventory -i "$inv_path" --host "$host" 2>/dev/null) || true
            if [ -n "$json" ] && [ "$json" != "{}" ]; then
              ip=$(printf '%s' "$json" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('ansible_host') or d.get('ansible_ssh_host') or '',end='')" 2>/dev/null || true)
            fi
            if [ -z "$ip" ]; then
              ip=$(ANSIBLE_NOCOLOR=1 ansible -i "$inv_path" -m debug -a 'var=ansible_host' "$host" 2>/dev/null | sed -n 's/.*"ansible_host": "\([^"]*\)".*/\1/p' | head -1)
            fi
            printf '%s' "$ip"
          }
          INV="${{ env.ANSIBLE_INVENTORY }}"
          HOST_STR="${{ env.HOST }}"
          IPS_CSV=""
          while IFS= read -r h; do
            h=$(echo "$h" | xargs)
            [ -z "$h" ] && continue
            ip=$(lookup_mgmt_ip "$INV" "$h")
            [ -z "$ip" ] && { echo "Error: could not resolve ansible_host for '$h' in ansible/${INV}" >&2; exit 1; }
            if [ -z "$IPS_CSV" ]; then IPS_CSV="$ip"; else IPS_CSV="$IPS_CSV,$ip"; fi
          done <<< "$(echo "$HOST_STR" | tr ',' '\n')"
          echo "SWITCH_IPS=$IPS_CSV" >> "$GITHUB_ENV"
          echo "SWITCH_IP=$(echo "$IPS_CSV" | cut -d',' -f1)" >> "$GITHUB_ENV"

      - name: Configure Allure environment
        run: |
          # Decode the shared Allure job-run env (ALLURE_JOB_RUN_ID, ALLURE_LAUNCH_ID,
          # ALLURE_USERNAME, ...) created by the setup-allure job. Written to /tmp/allure-env
          # so the docker exec calls below can refresh a (possibly reused) container's Allure
          # context via --env-file, and exported to $GITHUB_ENV for any host-side steps.
          echo "${{ needs.setup-allure.outputs.allure-env }}" | base64 -d > /tmp/allure-env
          echo "Echoing /tmp/allure-env"
          cat /tmp/allure-env
          cat /tmp/allure-env >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          # Strip CR (\r) before splitting: a stray carriage return from a CRLF-pasted
          # test_files input survives word-splitting (IFS has no \r) and would otherwise
          # glue onto the filename (e.g. "certmgmt_tests.txt\r"), making run_tests.sh fail.
          filelist=($(echo "${{ env.TEST_FILES }}" | tr -d '\r' | tr "," "\n"))

          rpc_pull_success="${{ needs.setup.outputs.rpc_pull_success }}"
          if [ "$rpc_pull_success" == "false" ]; then
            echo "RPC image pull failed - filtering out qos test files"
            filtered_filelist=()
            for file in "${filelist[@]}"; do
              file_trimmed=$(echo "$file" | xargs)
              if [[ ! "$file_trimmed" =~ [qQ][oO][sS] ]]; then
                filtered_filelist+=("$file_trimmed")
              else
                echo "Skipping test file containing 'qos': $file_trimmed (RPC image not available)"
              fi
            done
            filelist=("${filtered_filelist[@]}")
          else
            echo "RPC image pull succeeded - including all test files including qos"
          fi

          num_files=${#filelist[@]}

          for i in "${!filelist[@]}"; do
            file="${filelist[$i]}"
            # Defensive: drop any stray CR/newline/tab/space from the file name.
            file="${file//[$'\r\n\t ']/}"
            parseout=($(echo ${file} | tr "." "\n"))
            suite_name="${parseout[0]}"
            # Strip trailing _<digits> so that all numbered splits of a suite
            # (e.g. base_suite_tests_1, base_suite_tests_2, base_suite_tests_t1_3)
            # share a single canonical deselect file (base_suite_tests_deselect.txt,
            # base_suite_tests_t1_deselect.txt, etc.).
            canonical_suite=$(echo "$suite_name" | sed -E 's/_[0-9]+$//')
            deselect_file="${canonical_suite}_deselect.txt"

            echo "echo env vars"
            docker exec ${{ env.SONIC_MGMT_CONTAINER }} env

            echo "Start running testfile ${file}"
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] Start running testfile ${file}" >> test_status.json

            TEST_EXIT_CODE=0
            extra_flags="--skip_sanity --run-stress-tests --deselect-file=${deselect_file} --alluredir=allure-results/${suite_name}"
            if grep -q 'copp' tests/${file}; then
              extra_flags="${extra_flags} --copp_swap_syncd"
            fi
            if grep -q 'sflow' tests/${file}; then
              extra_flags="${extra_flags} --enable_sflow_feature"
            fi
            TOPOLOGY_FILTER="${TOPO_FOR_TESTS},any"
            echo "Suite run_tests.sh: TOPO=${TOPO} TOPO_FOR_TESTS=${TOPO_FOR_TESTS} file=${file} -t ${TOPOLOGY_FILTER}"
            docker exec ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/tests && sudo ./run_tests.sh -d ${{ env.HOST }}  -f ../ansible/${{ env.TESTBEDFILE }} -i ../ansible/${{ env.ANSIBLE_INVENTORY }} -k debug -l debug -p test_logs/logs-${suite_name} -F ${file} -t ${TOPOLOGY_FILTER} -n ${{ env.TESTBED }} -e '${extra_flags}' -u" || TEST_EXIT_CODE=$?

            if [ $TEST_EXIT_CODE -ne 0 ]; then
              echo "ERROR: Test file ${file} failed with exit code $TEST_EXIT_CODE"
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] Test file ${file} failed" >> test_status.json
            fi

            docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/tests && find allure-results/${suite_name} -type f -name '*-attachment.txt' -size +2M -delete" || true
            docker exec \
              --env-file /tmp/allure-env \
              -e ALLURE_ENDPOINT=${{ env.ALLURE_ENDPOINT }} \
              -e ALLURE_PROJECT_ID=${{ env.ALLURE_PROJECT_ID }} \
              -e ALLURE_TOKEN=${{ secrets.ALLURE_TOKEN }} \
              ${{ env.SONIC_MGMT_CONTAINER }} \
              bash -c "cd /var/AzDevOps/tests && /usr/local/bin/allurectl upload allure-results/${suite_name}" || true
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] Uploaded results for ${file}" >> test_status.json

            if [[ $i -lt $((num_files - 1)) ]]; then
                # Check if current and next suite names share the same prefix
                should_skip_cleanup=false
                next_file="${filelist[$((i + 1))]}"
                next_parseout=($(echo ${next_file} | tr "." "\n"))
                next_suite_name="${next_parseout[0]}"

                if [[ -n "$next_suite_name" ]]; then
                    # Extract prefix by removing trailing number pattern (e.g., _1, _2, etc.)
                    # Use extended regex to match one or more digits after underscore
                    current_prefix=$(echo "$suite_name" | sed -E 's/_[0-9]+$//')
                    next_prefix=$(echo "$next_suite_name" | sed -E 's/_[0-9]+$//')
                    if [[ "$current_prefix" == "$next_prefix" && -n "$current_prefix" ]]; then
                        should_skip_cleanup=true
                        echo "Skipping cleanup: ${suite_name} and ${next_suite_name} share the same prefix (${current_prefix})"
                    fi
                fi

                if [[ "$should_skip_cleanup" == "false" ]]; then
                    if [ "${SKIP_TOPO}" != "true" ]; then
                      echo "Run cleanup between suites"
                      echo "Remove topo"
                      docker exec -u ${USER} ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{ env.TESTBEDFILE }} -m ${{ env.ANSIBLE_INVENTORY }} -k ceos remove-topo ${{ env.TESTBED }} ./password.txt -vvvv"

                      echo "Add topo"
                      docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{ env.TESTBEDFILE }} -m ${{ env.ANSIBLE_INVENTORY }} -k ceos add-topo ${{ env.TESTBED }} ./password.txt -vvvv -e ptf_imagetag=${{ inputs.sonic_version }}"

                      echo "Deploy minigraph"
                      docker exec -u root ${{ env.SONIC_MGMT_CONTAINER }} bash -c "cd /var/AzDevOps/ansible && ./testbed-cli.sh -t ${{env.TESTBEDFILE}} deploy-mg ${{ env.TESTBED }} ${{ env.ANSIBLE_INVENTORY }} ./password.txt -e use_ptf_tacacs_server=false -vvv"
                    else
                      echo "Skipping remove-topo, add-topo, and deploy-mg between suites (skip_topo=true)"
                    fi
                fi
            fi
          done

  upload-allure-results:
    name: Upload Allure results to S3
    needs: [normalize-inputs, setup-allure, setup, run-test-and-generate-report]
    if: always()
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    env:
      ALLURE_S3_BUCKET: allure-results-tests
      AWS_REGION: us-west-2
      HOST: ${{ needs.normalize-inputs.outputs.host }}
      TESTBED: ${{ needs.normalize-inputs.outputs.testbed }}
      LAUNCH_DATE: ${{ needs.setup-allure.outputs.launch-date }}

    steps:
      - name: Detect AWS credentials for Allure S3
        id: aws_for_allure
        run: |
          if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure AWS credentials
        if: steps.aws_for_allure.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy Allure results from sonic-mgmt container to S3
        if: steps.aws_for_allure.outputs.available == 'true'
        run: |
          TOPO=$(cut -d "_" -f 3 <<< "${TESTBED}")
          SONIC_MGMT_CONTAINER="sonic-mgmt-ngty-${TOPO}"
          TOPO_LABEL=$(echo "$TOPO" | sed 's/^t/T/')
          LD="${LAUNCH_DATE:-$(TZ=America/Los_Angeles date '+%m/%d/%y')}"
          DATE_MM_DD_YY="${LD//\//-}"
          STAGING=$(mktemp -d)
          trap 'rm -rf "$STAGING"' EXIT
          ALLURE_IN_CONTAINER="/var/AzDevOps/tests/allure-results"
          if ! docker exec "${SONIC_MGMT_CONTAINER}" true 2>/dev/null; then
            echo "Could not access ${SONIC_MGMT_CONTAINER} (container missing, not running, or job ran on a different runner)"
            exit 1
          fi
          if ! docker exec "${SONIC_MGMT_CONTAINER}" test -d "${ALLURE_IN_CONTAINER}"; then
            echo "No ${ALLURE_IN_CONTAINER} in ${SONIC_MGMT_CONTAINER}"
            exit 1
          fi
          # One .tar.gz per top-level suite directory (e.g. l2_suite_tests_1.tar.gz); optional archive for loose files at allure-results/
          while IFS= read -r -d '' dirpath; do
            name=$(basename "$dirpath")
            echo "Archiving suite directory: ${name}"
            if ! docker exec "${SONIC_MGMT_CONTAINER}" tar -C "${ALLURE_IN_CONTAINER}" -czf - "${name}" > "${STAGING}/${name}.tar.gz"; then
              echo "Failed to archive ${name} from ${SONIC_MGMT_CONTAINER}"
              exit 1
            fi
          done < <(docker exec "${SONIC_MGMT_CONTAINER}" find "${ALLURE_IN_CONTAINER}" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null)

          ROOT_FILE_COUNT=$(docker exec "${SONIC_MGMT_CONTAINER}" find "${ALLURE_IN_CONTAINER}" -mindepth 1 -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${ROOT_FILE_COUNT}" -gt 0 ]; then
            echo "Archiving ${ROOT_FILE_COUNT} root-level file(s) to allure-results-root-files.tar.gz"
            if ! docker exec "${SONIC_MGMT_CONTAINER}" bash -c 'cd "'"${ALLURE_IN_CONTAINER}"'" && find . -maxdepth 1 -type f -print0 | tar -czf - --null -T -' > "${STAGING}/allure-results-root-files.tar.gz"; then
              echo "Failed to archive root-level files from ${SONIC_MGMT_CONTAINER}"
              exit 1
            fi
          fi

          if [ -z "$(ls -A "$STAGING" 2>/dev/null)" ]; then
            echo "No Allure files under tests/allure-results"
            exit 1
          fi
          HOST_SAFE="${HOST//,/_}"
          S3_URI="s3://${ALLURE_S3_BUCKET}/${DATE_MM_DD_YY}/${TOPO_LABEL}/${HOST_SAFE}/allure-results/"
          echo "Copying tests/allure-results to ${S3_URI}"
          if ! aws s3 cp "$STAGING/" "$S3_URI" --recursive --region "${AWS_REGION}"; then
            echo "S3 upload failed to $S3_URI"
            exit 1
          fi

  upload-logs:
    needs: [normalize-inputs, setup-allure, setup, run-test-and-generate-report]
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    if: always()
    env:
      HOST: ${{ needs.normalize-inputs.outputs.host }}
      TESTBED: ${{ needs.normalize-inputs.outputs.testbed }}
    steps:
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ env.HOST }}-${{ env.TESTBED }}
          path: tests/test_logs

  cleanup-allure:
    needs: [normalize-inputs, setup-allure, setup, run-test-and-generate-report]
    runs-on: ${{ needs.normalize-inputs.outputs.runner_label }}
    if: always()
    steps:
      - name: install and configure allurectl
        uses: allure-framework/setup-allurectl@v1.0.0
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}
          github-token: ${{ secrets.GH_PAT }}
      - name: stop allure job run
        run: |
          # Only stop the job run if we created it (not if using shared job run)
          if [ -z "${{ inputs.ALLURE_ENV }}" ]; then
            echo "Stopping Allure job run created by this workflow..."
            # Decode and export allure environment variables
            echo "${{ needs.setup-allure.outputs.allure-env }}" | base64 -d > /tmp/allure-env
            export $(cat /tmp/allure-env)
            allurectl job-run stop
            echo "Allure job run stopped"
          else
            echo "Using shared Allure job run - cleanup will be handled by parent workflow"
            echo "Skipping job run stop (using shared job run from parent workflow)"
          fi
