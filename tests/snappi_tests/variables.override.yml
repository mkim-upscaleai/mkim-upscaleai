caspian_testbed_snappi_sonic:
  multidut_port_info:
    # --- (1, 1) multi-DUT: spine1:E504 (Card1/Port1) TX -> leaf1:E504 (Card1/Port3) RX ---
    # Used by all tests with number_of_tx_rx_ports=(1,1). Traffic crosses the inter-DUT links.
    - multi-dut-single-asic:
        rx_ports:
          - hostname: upscale-sys-leaf1
            port_name: Ethernet504
        tx_ports:
          - hostname: upscale-sys-spine1
            port_name: Ethernet504
    # --- (1, 1) single-DUT: spine1:E504 (Card1/Port1) TX -> spine1:E496 (Card1/Port5) RX ---
    # Used by all tests with number_of_tx_rx_ports=(1,1). Both ports on spine1 (loopback path).
    - single-dut-single-asic:
        rx_ports:
          - hostname: upscale-sys-spine1
            port_name: Ethernet496
        tx_ports:
          - hostname: upscale-sys-spine1
            port_name: Ethernet504
    # --- (2, 1) multi-DUT: spine1:E504+E496 TX -> leaf1:E504 RX (2:1 oversubscription) ---
    # Used by tests with number_of_tx_rx_ports=(2,1), e.g. test_lossless_response_to_external_pause_storms.
    - multi-dut-single-asic:
        rx_ports:
          - hostname: upscale-sys-leaf1
            port_name: Ethernet504
        tx_ports:
          - hostname: upscale-sys-spine1
            port_name: Ethernet504
          - hostname: upscale-sys-spine1
            port_name: Ethernet496
    # --- (1, 2) multi-DUT: spine1:E496 TX -> leaf1:E504+spine1:E504 RX (1:2 diverging) ---
    # Used by tests with number_of_tx_rx_ports=(1,2), e.g. test_lossless_response_to_throttling_pause_storms,
    # test_m2o_oversubscribe_*, test_m2o_fluctuating_lossless.
    - multi-dut-single-asic:
        rx_ports:
          - hostname: upscale-sys-leaf1
            port_name: Ethernet504
          - hostname: upscale-sys-spine1
            port_name: Ethernet504
        tx_ports:
          - hostname: upscale-sys-spine1
            port_name: Ethernet496
  pfcQueueGroupSize: 4
  # DUTs that must advertise their directly-connected subnets into BGP so that
  # traffic generators attached to them can be reached by other DUTs.
  bgp_redistribute_connected_hosts:
    - upscale-sys-leaf1
    - upscale-sys-spine1
