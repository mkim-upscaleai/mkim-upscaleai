            wm_buf_pool_lossless:
                dscp: 3
                ecn: 1
                pg: 3
                queue: 3
                pkts_num_leak_out: 0
                # SPC4/SPC5 (e.g. SN5610) pool watermark behaviour with 64-byte packets
                # -----------------------------------------------------------------------
                # BufferPoolWatermarkTest uses 64-byte packets by default (no packet_size
                # is set for this profile, so PTF falls back to its 64-byte default).
                # Each 64-byte packet occupies exactly 1 cell (192-byte cell size).
                #
                # DEAD ZONE (pkts_num_fill_ingr_min = 352):
                #   On SPC4/SPC5 with port-alpha enabled, the per-port-pool guaranteed
                #   minimum buffer (pg_q_reserved_size = 352 cells) is physically consumed
                #   but invisible to SBPR pool-watermark statistics.  The test must send
                #   at least 352 packets before the pool watermark becomes non-zero.
                #   Set to 0 for older Mellanox platforms where the generator computes
                #   this dynamically from xon.
                pkts_num_fill_ingr_min: 352    # dead zone: 352 cells × 192 B/cell = 67,584 B
                #
                # SHARED POOL FILL CAP (pkts_num_fill_shared = 147772):
                #   With 64-byte packets on SPC4/SPC5, both PFCtest and
                #   BufferPoolWatermarkTest consistently cap at 147,420 SBPR cells
                #   regardless of how many packets are sent.  The same test with 800-byte
                #   packets correctly reaches ~173,459 cells, confirming this is a
                #   packet-size-specific hardware behaviour (not a test timing or PBS
                #   burst artefact).
                #
                #   The 26,038-cell (~5 MB) gap between the theoretical maximum
                #   (173,459 cells = pkts_num_trig_pfc - dead_zone) and the observable
                #   maximum (147,420 cells) is a reproducible hardware characteristic of
                #   SPC4/SPC5 with 64-byte packets.
                #
                #   pkts_num_fill_shared = 147,420 (observable SBPR max)
                #                        + 352     (dead-zone packets sent in Phase 1)
                #                        = 147,772
                pkts_num_fill_shared: 147772
                pkts_num_fill_egr_min: 0
            wm_buf_pool_lossy:
                dscp: 8
                ecn: 1
                pg: 0
                queue: 0
                pkts_num_leak_out: 0
                pkts_num_fill_ingr_min: 0
                pkts_num_fill_egr_min: 0
            wrr_chg:
                ecn: 1
                q0_num_of_pkts: 80
                q1_num_of_pkts: 80
                q2_num_of_pkts: 80
                q3_num_of_pkts: 300
                q4_num_of_pkts: 300
                q5_num_of_pkts: 80
                q6_num_of_pkts: 80
                limit: 80
                pkts_num_leak_out: 48
                lossy_weight: 8
                #lossless_weight: 8
                # lossless queues (Q3, Q4) hold 300 pkts each vs 80 pkts for each lossy queue.
                # lossless_weight must be set proportionally so all queues drain simultaneously:
                #   drain_time = pkts / (weight / total_weight)
                #   For simultaneous drain: 300 / lossless_weight = 80 / lossy_weight
                #   => lossless_weight = (300 / 80) * lossy_weight = 3.75 * 8 = 30
                # With lossless_weight=30 and lossy_weight=8:
                #   total_weight = 2*30 + 5*8 = 100
                #   Q3/Q4 each get 30% BW -> drain 300 pkts in 1000 time units
                #   Q0/Q1/Q2/Q5/Q6 each get 8% BW -> drain 80 pkts in 1000 time units
                # All 7 queues empty simultaneously, keeping diff well within limit=80.
                lossless_weight: 30
