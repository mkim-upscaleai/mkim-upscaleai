# Special qos config
#
qos_params:
    spc4:
        profile:
            pkts_num_leak_out: 1
            xoff_1:
                packet_size: 800
            xoff_2:
                packet_size: 800
            xoff_3:
                packet_size: 800
            xoff_4:
                packet_size: 800
            wm_pg_headroom:
                packet_size: 800
            wm_q_shared_lossless:
                packet_size: 700
            hdrm_pool_size:
                packet_size: 800
        xon_1:
            packet_size: 800
        xon_2:
            packet_size: 800
        xon_3:
            packet_size: 800
        xon_4:
            packet_size: 800
        lossy_queue_1:
            packet_size: 1200
        wm_pg_shared_lossless:
            packet_size: 800
            # The test computes pkts_num_fill_shared statically from the pool size
            # via the dynamic-threshold formula (alpha/(1+alpha) * pool_size).
            # The SPC4/SPC5 ASIC evaluates the same formula dynamically per cell
            # admission, and its actual drop threshold is ~180 cells higher than
            # the static approximation.  This is a systematic hardware/formula
            # offset, not pool size drift (pool size was confirmed stable during
            # the test run).  margin=200 covers the ~180-cell gap with 20 cells
            # of headroom.
            # The fill loop step size is capped at 11 in sai_qos_tests.py so this
            # large margin does not affect the fill-phase batch size.
            pkts_num_margin: 200
        wm_pg_shared_lossy:
            packet_size: 1200
            pkts_num_margin: 8
        wm_q_shared_lossy:
            packet_size: 1200
    spc5:
        profile:
            pkts_num_leak_out: 1
            xoff_1:
                packet_size: 800
            xoff_2:
                packet_size: 800
            xoff_3:
                packet_size: 800
            xoff_4:
                packet_size: 800
            wm_pg_headroom:
                packet_size: 800
            wm_q_shared_lossless:
                packet_size: 700
            hdrm_pool_size:
                packet_size: 800
        xon_1:
            packet_size: 800
        xon_2:
            packet_size: 800
        xon_3:
            packet_size: 800
        xon_4:
            packet_size: 800
        lossy_queue_1:
            packet_size: 1200
            pkts_num_margin: 5
        wm_pg_shared_lossless:
            packet_size: 800
            pkts_num_margin: 7
        wm_pg_shared_lossy:
            packet_size: 1200
            pkts_num_margin: 8
        wm_q_shared_lossy:
            packet_size: 1200
